# PHOTON TRADE — config.yaml
# Şema: FINAL_SPEC.md §26. Değerler: DECISIONS.md (KARAR olanlar yazıldı).
# `REQUIRED` = BEKLİYOR / kaynakta değer yok. Bu alanlar için varsayılan ATANMAZ;
# ilgili modül başlamaz (fail-fast), `python -m photon check` eksikleri listeler.

mode:
  kind: SIGNAL_AND_BACKTEST          # DECISIONS §1 — sinyal + backtest
  auto_order: false                  # DECISIONS §1 — otomatik emir YOK

pairs: [EURUSD]                      # DECISIONS §1 — liste config'den, çoklu pariteye açık

# Parite bazlı parametreler (FM-02 girdileri).
pair_params:
  EURUSD:
    pip_size: 0.0001                 # parite özelliği
    pip_value_per_lot: 10            # KARAR (Aşama 0 cevabı): hesap USD
    lot_step: 0.01                   # KARAR
    min_lot: 0.01                    # KARAR
    symbols: {oanda: EUR_USD, dukascopy: EURUSD, ibkr: EUR.USD}   # kaynak başına enstrüman adı
    units_per_lot: 100000            # sinyalde lot yanında birim göstermek için (standart lot; pip değeri 10 USD ile tutarlı)

account: {currency: USD}

timeframes: {htf: H4, mtf: M15, ltf: M1}

timezones:
  storage: UTC                       # zaman damgaları UTC saklanır
  session: Europe/London             # seans saatleri (IANA, DST otomatik)
  display: Europe/Istanbul           # gösterim

# --- Market structure ------------------------------------------------------
swing_min_pullback_pips:             # MS-R008; DECISIONS §2
  EURUSD: {D1: 90, H4: 40, M15: 15, M1: REQUIRED}   # U-13: MS-R010 kalibrasyonuyla bulunacak (DECISIONS v2 §2) — değer gelene kadar REQUIRED
swing_threshold_inclusive: true      # D-16 KARAR: ≥ (en az)
min_swing_candles: 2                 # C-05
trend_change_confirmation: SINGLE_BOS   # D-14 KARAR
counter_htf_require_double_bos: true    # D-15 KARAR: 4H'ye karşı işlemde M15'te çift BOS (HH+HL)

# --- Zon / likidite / POI (DECISIONS v2 §3) --------------------------------
zone_draw_mode:                                 # D-01 KARAR: eğitmen kombinasyonu
  H4: RANGE                                     # tüm range
  M15: CANDLE                                   # onaylandı: son sell-to-buy mumu, tek mum (tüm range değil)
  M1: REACTION_BASE_TO_TOP                      # giriş kutusu = reaksiyon tabanı→tepesi
require_refined_ltf_zone_in_htf_poi: true       # D-02 KARAR
require_liquidation: true                       # EN-R001 adım 1 — ZORUNLU kapı
require_sweep_zone: false                       # D-03 KARAR: puan kriteri
require_inducement: false                       # D-04 KARAR: puan kriteri
require_pd_alignment: false                     # D-05 KARAR: puan kriteri
range_extreme_filter:                           # D-25 / PD-R003 — ZORUNLU kapı
  enabled: true
  allowed_band_pct: 25                          # long yalnız alt %25, short yalnız üst %25
  range_tf: M15                                 # varsayılan; Aşama 4'te teyit edilecek
swing_hold_confirmation: H4_CHOCH               # D-26 KARAR
range_detection: {type: INSIDE_BAR_CHAIN, min_candles: 3, breakout: CLOSE_OUTSIDE}   # B-01
breakout_strength: {extra_criterion: NONE}      # yapı kırılımı yeterli
reaction_min: {pips: 2, measured: REACTION_START_TO_REACTION_EXTREME}   # B-02
eqh_tolerance: {pips: 2}                        # LQ-R001
v_shape_metric: REQUIRED                        # B-05: ölçüt Aşama 4'te önerilip onaylanacak

poi_scoring:                                    # DECISIONS v2 §3 — eşik puan YOK
  weights:
    bos_and_flip: 3
    swing_break: 2
    nested_zone: 2
    pro_trend: 2
    sweep_zone: 1.5
    inducement: 1.5
    pivot_zone: 1
    weak_target: 1
    pd_alignment: 1
    corrective_or_vshape: 1

# --- Giriş / stop ----------------------------------------------------------
decisional_flip_requires_sweep: false   # D-06 KARAR: sweep yoksa da flip zonundan gir
entry_type: CONFIRMATION                # D-07 KARAR
entry_price_mode: FIXED_SL              # D-08 KARAR
fixed_sl_pips: 2                        # D-08 KARAR
sl_buffer_pips: 0                       # D-09 KARAR: zonun hemen arkası, ek pay 0
min_sl_pips: 2                          # SL-R003

# --- Risk ------------------------------------------------------------------
risk_pct: 0.01                          # RK-R001 KARAR: %1 (tavan)
max_losses_per_day: 3                   # RK-R003
day_reset: {tz: Europe/Istanbul, time: "00:00"}   # D-18 KARAR

# --- Pozisyon yönetimi -----------------------------------------------------
risk_removal_method: PARTIAL            # D-10 KARAR
partial_pct: 20                         # D-11 KARAR
partial_at_r: 4                         # D-11 KARAR
pro_trend_reference: BOTH               # D-12 KARAR: 4H ve M15 ikisi de
target_allocation:                      # D-13
  pro_trend: {m15_weak_swing_pct: 60, h4_weak_swing_pct: 20}   # %20 ayrıca @4R
  counter_trend:
    first_target: NEXT_M15_SD_ZONE_OR_M15_SWING
    allocation_pct: 80                  # KARAR; %20@4R ile toplam 100
  range:
    targets: RANGE_EXTREMES
    allocation_pct: 100                 # KARAR: risk kaldırma sonrası kalan hacmin tamamı
    of: REMAINING_AFTER_RISK_REMOVAL

# --- Seans / zaman ---------------------------------------------------------
sessions_london: [["07:00", "10:00"], ["12:00", "15:00"]]   # SS-R001
blackout: {tz: UTC, start: "21:00", end: "23:00"}   # C-09 KARAR: GMT/UTC sabit
news_filter:                            # DECISIONS §6
  mode: WARN_ONLY                       # sinyal ENGELLENMEZ; uyarı notu
  provider: FOREXFACTORY
  currencies: [EUR, USD]
  impact: HIGH
  scope: ALL_SIGNALS_OF_DAY             # o gün yüksek etkili haber varsa günün tüm sinyallerine not
order_expiry:                           # DECISIONS §7
  mode: CANCEL_IF_FIRST_TARGET_REACHED_BEFORE_FILL

# --- Backtest --------------------------------------------------------------
intrabar_policy:                        # DECISIONS §7
  resolver: TICK
  fallback: STOP_FIRST                  # tick yoksa stop sayılır; sayısı raporlanır
costs:
  spread: FROM_DATA                     # bid/ask'tan
  commission:                           # IBKR forex (Aşama 0 cevabı); config'den değiştirilebilir
    model: PCT_OF_NOTIONAL
    rate_pct: 0.002                     # işlem tutarının %0.002'si (0.2 bps)
    min_per_order: 2
    currency: USD
reference_backtest: {pair: EURUSD, entry_tf: M15, start: "2021-09-01", end: "2021-09-30"}

# Q-D01 KARAR (Aşama 1): H4/D1 mum sınırları.
candle_boundaries:
  tz: America/New_York  # Q-D01 KARAR: TradingView FX, DST NY'ye göre
  d1_open: "17:00"      # günlük mum NY 17:00 kapanış/açılış
  h4_anchor: "17:00"    # H4 açılışları NY: 17,21,01,05,09,13
# Q-D02 KARAR: yapı motoruna verilen fiyat (BID|ASK).
candle_price_side: BID      # Q-D02 KARAR: TradingView FX = bid; backtest dolumları bid/ask (long ask, short bid)

data:
  live: {provider: IBKR, library: ib_async, venue: IDEALPRO, read_only: true,
         host: 127.0.0.1, port: 4001, client_id: 1}   # IB Gateway canlı (paper 4002, TWS 7496/7497)
  backtest:
    primary: OANDA_PRACTICE             # DECISIONS §1; hesap açılamazsa fallback
    fallback: DUKASCOPY
    oanda: {rest_host: api-fxpractice.oanda.com, token_env: OANDA_API_TOKEN}   # jeton ortam değişkeninde
    dukascopy: {base_url: "https://datafeed.dukascopy.com/datafeed", request_delay_s: 1.5, max_retries: 6}
    cache: {db: data_cache/photon.sqlite, raw_dir: data_cache/raw}

notifications: [SCREEN, LOG_FILE]

logging: {level: INFO, file: logs/photon.log}
