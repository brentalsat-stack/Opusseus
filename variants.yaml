# Varyant karşılaştırma (python -m photon backtest-compare --start ... --end ... --variants variants.yaml)
# Her varyant config.yaml üzerine OVERRIDE'dır (noktalı yol: değer); config.yaml değişmez.
# DECISIONS'ta "backtest sonrası karşılaştırılacak" denen seçenekler. Hiçbiri karar DEĞİLDİR — yalnızca etki ölçümü.
variants:
  - name: V0
    desc: "mevcut (FIXED_SL 2 pip, CONFIRMATION, flip->extreme)"
    overrides: {}
  - name: V1
    desc: "entry_price_mode=DISTAL (stop zon ucunun 1 pipette ötesi, giriş distal; stop uzunluğu zona göre)"
    overrides: {entry_price_mode: DISTAL}
  - name: V2
    desc: "entry_price_mode=EQ (giriş zon ortası, stop zon ucunun 1 pipette ötesi)"
    overrides: {entry_price_mode: EQ}
  - name: V3
    desc: "FIXED_SL 3 pip"
    overrides: {fixed_sl_pips: 3}
  - name: V4
    desc: "FIXED_SL 5 pip"
    overrides: {fixed_sl_pips: 5}
  - name: V5
    desc: "V1 + extreme (V tepki kutusu) her zaman, flip yerine (EN-R008 C-11 seçeneği)"
    overrides: {entry_price_mode: DISTAL, entry_zone_choice: EXTREME_ALWAYS}
  - name: V6
    desc: "V0 + PD-R003 range filtresi kapalı (yalnızca etki ölçümü; karar değil)"
    overrides: {range_extreme_filter.enabled: false}

# ---- V8: M15 İCRA MODELİ (T-M15BT, EURUSD Eylül 2021 referans videosu) — kullanıcı kararı: ayrı profil, varsayılan config değişmez.
# execution_profile=M15 → rol kayması: HTF=D1 (rol "4H"), MTF=H4 (rol "M15": POI + yapı + izin CHoCH'u), icra=M15 (rol "M1": CHoCH, giriş kutusu, liquidation).
# entry_price_mode FIB25_*: "%25 kuralı" (AMBIGUOUS, Q-V8-2). session_gate=false: seans penceresi kapısı yok, rollover yasağı (21–23 UTC) yeni emir + dolumda geçerli.
# min_refine_pips=3: 3 pipten küçük POI rafine edilmez. Yönetim: 20%@4R (risk kaldırma), %60 ilk H4 zayıf swing, %20 sonraki H4 hedefi (management_second_target: NEXT_MID_ZONE), tutma onayı H4 CHoCH; CT 80 (Q-V8-5, kullanıcı kararı).
  - name: V8a
    desc: "M15 icra modeli, %25 kuralı proximal'den, haber filtresi yok"
    overrides: {execution_profile: M15, entry_price_mode: FIB25_FROM_PROXIMAL, session_gate: false, min_refine_pips: 3, management_second_target: NEXT_MID_ZONE}
  - name: V8b
    desc: "V8a + haber penceresi (olay ±30 dk: yeni emir/dolum yok, bekleyen iptal, açık pozisyon kapatılır) — data_samples/news_2021.csv gerekir"
    overrides:
      execution_profile: M15
      entry_price_mode: FIB25_FROM_PROXIMAL
      session_gate: false
      min_refine_pips: 3
      management_second_target: NEXT_MID_ZONE
      news_blackout: {file: data_samples/news_2021.csv, window_min: 30}
  - name: V8c
    desc: "V8a ama %25 DISTAL'dan (alternatif yorum, Q-V8-2)"
    overrides: {execution_profile: M15, entry_price_mode: FIB25_FROM_DISTAL, session_gate: false, min_refine_pips: 3, management_second_target: NEXT_MID_ZONE}

  # ---- V9: range_inside_rule=CLOSE (kullanıcı kararı; eğitmenin "sweep zone / wick zone"u): inside-bar zincirinde yalnız KAPANIŞLAR ilk mumun high–low'u içinde
  #      olmalı, fitil taşabilir; zon sınırı en uç fitile genişler, zon sweep_zone=True etiketlenir. Çıkış (kopuş) yine yalnız kapanışla.
  - name: V9a
    desc: "V8a + range_inside_rule=CLOSE"
    overrides: {execution_profile: M15, entry_price_mode: FIB25_FROM_PROXIMAL, session_gate: false, min_refine_pips: 3, management_second_target: NEXT_MID_ZONE, range_inside_rule: CLOSE}
  - name: V9b
    desc: "V0 + range_inside_rule=CLOSE"
    overrides: {range_inside_rule: CLOSE}

# V7: işlemleri ETKİLEMEZ — taban varyantın işlemleri için V-shape N'e göre puan dağılımı (config'teki N dahil edilir)
vshape_report:
  base: V0
  n_values: [5, 15, 20]

# Eğitmen işlemleriyle eşleştirme: bu aralıktaki (dolum zamanına göre) işlemler her varyantın klasörüne EURUSD_trades_detail.csv olarak yazılır
detail: {from: "2021-09-01", to: "2021-09-30"}
